name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: V0.1 validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Publication privacy
        shell: pwsh
        run: ./scripts/validation/check-repo-publication.ps1

      - name: Format, clippy and tests
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Release build with provenance
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Experiment 001 golden replay
        shell: pwsh
        run: ./scripts/validation/replay-exp001-golden.ps1

      - name: Documentation consistency
        shell: pwsh
        run: ./scripts/validation/check-doc-consistency.ps1
