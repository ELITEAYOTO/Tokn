name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: V0.1 validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependency policy tools
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none

      - name: RustSec audit
        shell: pwsh
        run: cargo audit

      - name: Dependency policy
        shell: pwsh
        run: cargo deny check advisories licenses bans sources

      - name: Publication privacy
        shell: pwsh
        run: ./scripts/validation/check-repo-publication.ps1

      - name: Install Gitleaks 8.30.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks_8.30.1_windows_x64.zip"
          $toolDir = Join-Path $env:RUNNER_TEMP "gitleaks-8.30.1"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip" -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e") {
            throw "Gitleaks archive checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          & (Join-Path $toolDir "gitleaks.exe") version

      - name: Secret history scan
        shell: pwsh
        run: |
          $gitleaks = Join-Path $env:RUNNER_TEMP "gitleaks-8.30.1\gitleaks.exe"
          & $gitleaks git --no-banner --redact=100 .

      - name: PowerShell syntax
        shell: pwsh
        run: ./scripts/validation/check-powershell-syntax.ps1

      - name: Benchmark manifest
        shell: pwsh
        run: ./scripts/validation/check-benchmark-manifest.ps1

      - name: Format, clippy and tests
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Release build with provenance
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Package privacy
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Local MCP prototype smoke
        shell: pwsh
        run: ./scripts/validation/check-mcp-prototype.ps1

      - name: Experiment 001 golden replay
        shell: pwsh
        run: ./scripts/validation/replay-exp001-golden.ps1

      - name: Experiment 002 source-selection regression
        shell: pwsh
        run: ./scripts/validation/check-exp002-source-selection.ps1

      - name: Documentation consistency
        shell: pwsh
        run: ./scripts/validation/check-doc-consistency.ps1
