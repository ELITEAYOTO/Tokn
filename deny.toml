# Tokn dependency policy for cargo-deny 0.20.x.
# Keep exceptions narrow, documented, and reviewable.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate transitive versions are visible but do not fail the build yet.
# Wildcard dependency requirements are not accepted.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# crates.io remains the implicit trusted registry. Any additional registry or
# git dependency must be reviewed and explicitly allowed before it can merge.
unknown-registry = "deny"
unknown-git = "deny"
